<!doctype html>
<!--
  A small, made-up task board that capture.ts records into assets/tour.mp4. Everything is local (no network),
  and every animation is CSS or a timer, so it replays identically on Playwright's virtual clock.
  The tour calls window.tour.<step>() at the times in lib/tour.ts.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Board · example.com</title>
    <style>
      @font-face {
        font-family: "Inter";
        src: url("../assets/fonts/inter.woff2") format("woff2");
        font-weight: 100 900;
      }
      :root {
        --bg: #f8fafc;
        --panel: #ffffff;
        --text: #0f172a;
        --muted: #64748b;
        --line: #e2e8f0;
        --accent: #7c3aed;
        --accent-soft: #ede9fe;
        --green: #15803d;
        --amber: #b45309;
        --ease: cubic-bezier(0.65, 0, 0.35, 1);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body { font-family: Inter, system-ui, sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }
      header { height: 72px; display: flex; align-items: center; gap: 40px; padding: 0 40px; background: var(--panel); border-bottom: 1px solid var(--line); }
      .logo { font-weight: 800; font-size: 22px; letter-spacing: -0.5px; display: flex; align-items: center; gap: 10px; }
      .logo i { width: 26px; height: 26px; border-radius: 8px; background: linear-gradient(135deg, var(--accent), #06b6d4); }
      nav { display: flex; gap: 8px; }
      nav button { font: inherit; font-size: 16px; font-weight: 600; color: var(--muted); background: none; border: 0; padding: 10px 16px; border-radius: 10px; }
      nav button.on { color: var(--accent); background: var(--accent-soft); }
      .spacer { flex: 1; }
      .avatar { width: 36px; height: 36px; border-radius: 50%; background: #cbd5e1; }
      main { position: relative; height: calc(100% - 72px); overflow: hidden; }
      .view { position: absolute; inset: 0; padding: 40px; transition: transform 700ms var(--ease), opacity 700ms var(--ease); }
      .view.left { transform: translateX(-12%); opacity: 0; }
      .view.right { transform: translateX(12%); opacity: 0; }
      .title { display: flex; align-items: center; gap: 20px; margin-bottom: 28px; }
      h1 { margin: 0; font-size: 34px; letter-spacing: -0.8px; }
      .primary { font: inherit; font-weight: 700; font-size: 17px; color: #fff; background: var(--accent); border: 0; padding: 14px 24px; border-radius: 12px; transition: transform 150ms, filter 150ms; }
      .primary.pressed { transform: scale(0.95); filter: brightness(0.85); }
      .columns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }
      .column { background: #f1f5f9; border-radius: 18px; padding: 20px; min-height: 640px; }
      .column h2 { margin: 0 0 16px; font-size: 15px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); display: flex; justify-content: space-between; }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; margin-bottom: 14px; box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05); animation: rise 600ms var(--ease) both; }
      .card b { display: block; font-size: 18px; margin-bottom: 10px; }
      .tag { display: inline-block; font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
      .tag.green { background: #dcfce7; color: var(--green); }
      .tag.amber { background: #fef3c7; color: var(--amber); }
      .card.new { border-color: var(--accent); box-shadow: 0 0 0 5px var(--accent-soft); }
      .card.leaving { animation: leave 450ms var(--ease) both; }
      @keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
      @keyframes leave { to { opacity: 0; transform: translateX(60px); } }
      .drawer { position: absolute; top: 0; right: 0; bottom: 0; width: 520px; background: var(--panel); border-left: 1px solid var(--line); box-shadow: -30px 0 60px rgba(15, 23, 42, 0.12); padding: 40px; transform: translateX(110%); transition: transform 600ms var(--ease); }
      .drawer.open { transform: none; }
      .drawer h3 { margin: 0 0 28px; font-size: 26px; }
      .drawer label { display: block; font-size: 15px; font-weight: 600; color: var(--muted); margin-bottom: 8px; }
      .input { height: 56px; border: 2px solid var(--line); border-radius: 12px; padding: 0 16px; display: flex; align-items: center; font-size: 19px; margin-bottom: 24px; white-space: pre; }
      .input.focus { border-color: var(--accent); box-shadow: 0 0 0 5px var(--accent-soft); }
      .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; margin-bottom: 28px; }
      .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 24px 28px; }
      .stat span { color: var(--muted); font-weight: 600; font-size: 15px; }
      .stat strong { display: block; font-size: 48px; letter-spacing: -1.5px; margin-top: 6px; font-variant-numeric: tabular-nums; }
      .chart { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 28px; height: 470px; display: flex; flex-direction: column; }
      .chart h2 { margin: 0 0 20px; font-size: 20px; display: flex; justify-content: space-between; align-items: center; }
      .bars { flex: 1; display: flex; align-items: flex-end; gap: 22px; padding-top: 10px; }
      .bar { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 10px; height: 100%; justify-content: flex-end; }
      .bar div { width: 100%; border-radius: 10px 10px 4px 4px; background: linear-gradient(180deg, var(--accent), #a78bfa); height: 0; transition: height 900ms var(--ease); }
      .bar span { font-size: 14px; color: var(--muted); font-weight: 600; }
      .secondary { font: inherit; font-size: 15px; font-weight: 600; color: var(--text); background: #fff; border: 1px solid var(--line); padding: 10px 18px; border-radius: 10px; }
    </style>
  </head>
  <body>
    <header>
      <div class="logo"><i></i>Board</div>
      <nav>
        <button id="tab-board" class="on">Board</button>
        <button id="tab-insights">Insights</button>
        <button>Team</button>
      </nav>
      <div class="spacer"></div>
      <div class="avatar"></div>
    </header>
    <main>
      <section id="board" class="view">
        <div class="title"><h1>Spring launch</h1><div class="spacer"></div><button id="new" class="primary">+ New task</button></div>
        <div class="columns">
          <div class="column" id="todo"><h2>To do <span>3</span></h2></div>
          <div class="column" id="doing"><h2>In progress <span>2</span></h2></div>
          <div class="column" id="done"><h2>Done <span>2</span></h2></div>
        </div>
        <aside class="drawer" id="drawer">
          <h3>New task</h3>
          <label>Title</label>
          <div class="input" id="field-title"></div>
          <label>Label</label>
          <div class="input" id="field-label"></div>
          <button class="primary" id="create">Create task</button>
        </aside>
      </section>
      <section id="insights" class="view right">
        <div class="title"><h1>Insights</h1><div class="spacer"></div><button class="secondary" id="export">Export CSV</button></div>
        <div class="stats">
          <div class="stat"><span>Tasks closed this week</span><strong id="n-closed">0</strong></div>
          <div class="stat"><span>Median time to done</span><strong id="n-median">0.0 d</strong></div>
          <div class="stat"><span>On track</span><strong id="n-track">0%</strong></div>
        </div>
        <div class="chart">
          <h2>Closed per day <span class="tag green">+18% vs last week</span></h2>
          <div class="bars" id="bars"></div>
        </div>
      </section>
    </main>
    <script>
      const cards = {
        todo: [["Write release notes", "Docs"], ["Record the demo video", "Marketing", "amber"], ["Update pricing page", "Web"]],
        doing: [["Onboarding checklist", "Product"], ["Fix export timeouts", "Bug", "amber"]],
        done: [["Design review", "Design", "green"], ["Beta invite email", "Marketing", "green"]],
      };
      const card = ([title, tag, tone = ""], delay = 0) => {
        const el = document.createElement("div");
        el.className = "card";
        el.style.animationDelay = `${delay}ms`;
        el.innerHTML = `<b>${title}</b><span class="tag ${tone}">${tag}</span>`;
        return el;
      };
      const count = (id) => (document.querySelector(`#${id} h2 span`).textContent = document.querySelectorAll(`#${id} .card:not(.leaving)`).length);
      let i = 0;
      for (const [col, list] of Object.entries(cards)) for (const c of list) document.getElementById(col).append(card(c, 120 * i++));

      // Types `text` into `el` at a human-ish pace (setTimeout, so it follows the virtual clock).
      const type = (el, text, cps = 14) =>
        new Promise((done) => {
          el.classList.add("focus");
          let n = 0;
          const next = () => {
            el.textContent = text.slice(0, ++n);
            if (n < text.length) setTimeout(next, (1000 / cps) * (text[n - 1] === " " ? 1.6 : 0.8 + ((n * 7) % 5) / 10));
            else setTimeout(() => (el.classList.remove("focus"), done()), 250);
          };
          setTimeout(next, 200);
        });
      const press = (el) => (el.classList.add("pressed"), setTimeout(() => el.classList.remove("pressed"), 160));
      const tween = (el, to, ms, fmt) => {
        const start = Date.now();
        const tick = () => {
          const p = Math.min(1, (Date.now() - start) / ms);
          el.textContent = fmt(to * (1 - Math.pow(1 - p, 3)));
          if (p < 1) setTimeout(tick, 16);
        };
        tick();
      };

      window.tour = {
        // Open the drawer and fill in a task.
        async newTask() {
          press(document.getElementById("new"));
          document.getElementById("drawer").classList.add("open");
          await new Promise((r) => setTimeout(r, 650));
          await type(document.getElementById("field-title"), "Ship v2 announcement");
          await type(document.getElementById("field-label"), "Launch");
        },
        // Create it: the drawer closes and the card lands on top of "To do".
        create() {
          press(document.getElementById("create"));
          setTimeout(() => {
            document.getElementById("drawer").classList.remove("open");
            const el = card(["Ship v2 announcement", "Launch"]);
            el.classList.add("new");
            el.id = "v2";
            document.querySelector("#todo h2").after(el);
            count("todo");
          }, 200);
        },
        // Move the new card along to "In progress", then "Done".
        advance() {
          const move = (to, tone, delay) =>
            setTimeout(() => {
              const old = document.getElementById("v2");
              const from = old.parentElement.id;
              old.classList.add("leaving");
              count(from);
              setTimeout(() => {
                old.remove();
                const el = card(["Ship v2 announcement", "Launch", tone]);
                el.classList.add("new");
                el.id = "v2";
                document.querySelector(`#${to} h2`).after(el);
                count(to);
              }, 450);
            }, delay);
          move("doing", "amber", 0);
          move("done", "green", 1500);
        },
        // Switch to the Insights tab: the views slide, the counters and bars grow.
        insights() {
          document.getElementById("tab-board").classList.remove("on");
          document.getElementById("tab-insights").classList.add("on");
          document.getElementById("board").classList.add("left");
          document.getElementById("insights").classList.remove("right");
          const values = [12, 18, 15, 22, 27, 19, 31];
          const bars = document.getElementById("bars");
          bars.innerHTML = values
            .map((v, d) => `<div class="bar"><div style="transition-delay:${300 + d * 90}ms" data-h="${(v / 31) * 100}%"></div><span>${["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"][d]}</span></div>`)
            .join("");
          bars.offsetHeight; // commit the 0 heights so the transition runs
          for (const b of bars.querySelectorAll("[data-h]")) b.style.height = b.dataset.h;
          setTimeout(() => {
            tween(document.getElementById("n-closed"), 144, 1000, (v) => Math.round(v));
            tween(document.getElementById("n-median"), 1.8, 1000, (v) => `${v.toFixed(1)} d`);
            tween(document.getElementById("n-track"), 92, 1000, (v) => `${Math.round(v)}%`);
          }, 300);
        },
      };
    </script>
  </body>
</html>
